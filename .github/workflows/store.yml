name: Store upload package
on:
  workflow_dispatch:
    inputs:
      identity:
        description: 'New app identity name from Partner Center'
        required: true
        type: string
      publisher:
        description: 'Publisher CN from Partner Center'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Build Store packages
        shell: pwsh
        env:
          ITHOME_MSIX_IDENTITY: ${{ inputs.identity }}
          ITHOME_MSIX_PUBLISHER: ${{ inputs.publisher }}
        run: ./scripts/build-store.ps1 -AllArchitectures
      - uses: actions/upload-artifact@v4
        with:
          name: ithome-msix-store-upload
          path: |
            src-tauri/target/store/*/upload/*.msix
            src-tauri/target/store/*/upload/*.msixbundle
