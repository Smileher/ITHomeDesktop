[package]
name = "ithome-desktop"
version = "0.1.4"
description = "Unofficial IT Home desktop client"
authors = ["Smileher"]
edition = "2021"

[lib]
name = "ithome_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn", "json"] }
tokio = { version = "1", features = ["sync", "time"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
des = "0.8"
scraper = { version = "0.26", default-features = false }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
